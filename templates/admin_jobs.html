<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Manage Jobs</title>
</head>
<body>
    <h2>Admin - Manage Jobs</h2>
<a href="{{ url_for('new_job') }}">➕ Add New Job</a>
<ul>
  {% for job in jobs %}
    <li>
      <b>{{ job.title }}</b> at {{ job.company }} |
      <a href="{{ url_for('edit_job', job_id=job.id) }}">Edit</a> |
      <a href="{{ url_for('delete_job', job_id=job.id) }}">Delete</a>
    </li>
  {% endfor %}
</ul>

</body>
</html>
